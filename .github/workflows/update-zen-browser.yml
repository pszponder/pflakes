name: Update Zen Browser
on:
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: update-browser-pins

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086

      - name: Update and smoke-test the official Zen release
        id: pin
        run: |
          bash scripts/update-zen-browser.sh
          if ! git diff --quiet -- flakes/zen-browser/release.json; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit the verified pins
        if: steps.pin.outputs.changed == 'true'
        run: |
          version=$(nix eval --raw .#zen-browser.version)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flakes/zen-browser/release.json
          git commit -m "zen-browser: update official release to $version"
          git push
