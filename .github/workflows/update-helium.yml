name: Update Helium
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: update-browser-pins

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flakes/helium
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Check the upstream Linux release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash latest-release.sh > "$RUNNER_TEMP/helium.json"
          cp "$RUNNER_TEMP/helium.json" release.json
          if ! git diff --quiet -- release.json; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877
        if: steps.release.outputs.changed == 'true'

      - name: Build and smoke-test the new x86-64 package
        if: steps.release.outputs.changed == 'true'
        run: nix run . -- --version

      - name: Commit the verified release
        if: steps.release.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release.json
          git commit -m "helium: update to $(jq -r .version release.json)"
          git push
